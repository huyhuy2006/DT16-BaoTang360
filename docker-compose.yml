services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:?Run tools/Initialize-DT16.ps1 first}
      MYSQL_USER: ${MYSQL_USER:?Run tools/Initialize-DT16.ps1 first}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Run tools/Initialize-DT16.ps1 first}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Run tools/Initialize-DT16.ps1 first}
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 30

  python-service:
    build: ./python-service
    environment:
      PYTHON_SERVICE_TOKEN: ${PYTHON_SERVICE_TOKEN:?Run tools/Initialize-DT16.ps1 first}
    ports:
      - "127.0.0.1:8001:8001"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/healthz', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    environment:
      APP_ENV: ${APP_ENV:-local}
      APP_DEBUG: ${APP_DEBUG:-true}
      APP_KEY: ${APP_KEY:?Run tools/Initialize-DT16.ps1 first}
      APP_URL: ${APP_URL:-http://localhost:8080}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-baotang_ao}
      DB_USERNAME: ${DB_USERNAME:-baotangso_app}
      DB_PASSWORD: ${DB_PASSWORD:?Run tools/Initialize-DT16.ps1 first}
      FILESYSTEM_DISK: public
      PYTHON_SERVICE_URL: http://python-service:8001
      PYTHON_SERVICE_TOKEN: ${PYTHON_SERVICE_TOKEN:?Run tools/Initialize-DT16.ps1 first}
      PYTHON_SERVICE_TIMEOUT: ${PYTHON_SERVICE_TIMEOUT:-3}
    volumes:
      - ./backend:/var/www/html
    depends_on:
      mysql:
        condition: service_healthy
      python-service:
        condition: service_healthy

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - ./backend:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend

  frontend:
    image: node:20-alpine
    working_dir: /app
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8080/api}
      VITE_STORAGE_BASE_URL: ${VITE_STORAGE_BASE_URL:-http://localhost:8080/storage}
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0"
    ports:
      - "127.0.0.1:5173:5173"
    volumes:
      - ./frontend:/app
    depends_on:
      - nginx

volumes:
  mysql_data:
